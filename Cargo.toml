[package]
name = "freo"
version = "1.2.0"
edition = "2021"
description = "Creo-style parametric 3D CAD for macOS, written in Rust"
license = "MIT"
default-run = "freo"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "persistence"] }
egui = "0.31"
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
ab_glyph = "0.2"
epaint_default_fonts = "0.31"
miniz_oxide = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
# 2D polygon booleans and offsets for the slicer (pure Rust)
i_overlay = "9.1"

[build-dependencies]
winresource = "0.1"

# local time for file dates (the offset from UTC, with daylight saving)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Linux needs a windowing backend; macOS uses AppKit without extra features
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["x11", "wayland"] }

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
