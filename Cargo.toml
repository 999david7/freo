[package]
name = "freo"
version = "0.1.0"
edition = "2021"
description = "Creo-style parametric 3D CAD for macOS, written in Rust"
license = "MIT"
default-run = "freo"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "persistence"] }
egui = "0.31"
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
ab_glyph = "0.2"
epaint_default_fonts = "0.31"
miniz_oxide = "0.8"

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
